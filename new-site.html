<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגשת בקשה לבניית אתר - NetVibe Media</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --font-main: 'Assistant', sans-serif;
            --font-heading: 'Heebo', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1, h2, h3 {
            font-family: var(--font-heading);
            color: var(--secondary);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--primary);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .back-link:hover {
            color: var(--primary-dark);
            transform: translateX(4px);
        }

        .form-card {
            background-color: var(--white);
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
            animation: slideUp 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 25px;
        }

        .brand-badge {
            display: inline-block;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-family: var(--font-heading);
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .form-header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 1rem;
            background-color: #fff;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        footer {
            padding: 30px 0;
            background-color: var(--secondary);
            color: #94a3b8;
            text-align: center;
            font-size: 0.95rem;
            margin-top: auto;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .form-card { padding: 25px; }
            .form-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">→ חזרה לעמוד הראשי</a>
        
        <div class="form-card">
            <div class="form-header">
                <span class="brand-badge">NetVibe Media</span>
                <h1>טופס בקשה לבניית אתר חדש</h1>
                <p>הזן את הפרטים הנדרשים והצוות שלנו יכין עבורך סקיצה ייעודית</p>
            </div>

            <form id="new-site-form">
                <div class="form-group">
                    <label>שם העסק / המותג</label>
                    <input type="text" id="businessName" placeholder="לדוגמה: ניר אימוני כושר" required>
                </div>

                <div class="form-group">
                    <label>תחום העיסוק / נישה</label>
                    <input type="text" id="niche" placeholder="לדוגמה: אימונים אישיים, קוסמטיקה, ייעוץ עסקי" required>
                </div>

                <div class="form-group">
                    <label>שם מלא ליצירת קשר</label>
                    <input type="text" id="fullName" placeholder="שם ושם משפחה" required>
                </div>

                <div class="form-group">
                    <label>כתובת דוא"ל</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label>מספר טלפון / וואטסאפ</label>
                    <input type="tel" id="phone" placeholder="050-0000000" required>
                </div>

                <div class="form-group">
                    <label>בחירת מסלול מבוקש</label>
                    <select id="plan" required>
                        <option value="standard">מסלול Standard - ₪250 / לחודש (הכל כלול)</option>
                        <option value="premium">מסלול Premium - ₪450 / לחודש (חנות / CRM)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>תאר עליכם בקצרה (או צרף קישור לעמוד פייסבוק/אינסטגרם)</label>
                    <textarea id="details" rows="5" placeholder="פרט בקצרה על השירותים של העסק, קהל היעד או העדפות עיצוב ספציפיות..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">שלח בקשה להקמת אתר</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 NetVibe Media. כל הפניות מנוהלות דרך המערכת הדיגיטלית בלבד.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYrdNSkWx8gUzkTyIMuIEKWMFfyU4ZuNs",
            authDomain: "netvibe-media.firebaseapp.com",
            projectId: "netvibe-media",
            storageBucket: "netvibe-media.firebasestorage.app",
            messagingSenderId: "345459958522",
            appId: "1:345459958522:web:5a7c1ee5517d8e60499f43",
            measurementId: "G-VQL10G9K24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('new-site-form');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'שולח...';

            try {
                await addDoc(collection(db, "requests"), {
                    type: "אתר חדש",
                    businessName: document.getElementById('businessName').value,
                    niche: document.getElementById('niche').value,
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    plan: document.getElementById('plan').value,
                    details: document.getElementById('details').value,
                    status: "חדש",
                    createdAt: serverTimestamp()
                });
                window.location.href = "thanks.html";
            } catch (error) {
                alert('שגיאה בשליחת הטופס: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'שלח בקשה להקמת אתר';
            }
        });
    </script>
</body>
</html>
